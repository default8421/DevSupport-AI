# @author: liuqinhe
# 服务器 overlay：给每个服务加内存上限与日志轮转，避免单服务占满宿主机。
# 限额合计约 3.1G。上线前先确认本机可用内存后再 up。
#
# 用法：
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
services:
  mysql:
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  redis:
    deploy:
      resources:
        limits:
          memory: 96M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  etcd:
    deploy:
      resources:
        limits:
          memory: 192M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  minio:
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  milvus:
    deploy:
      resources:
        limits:
          memory: 1280M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    deploy:
      resources:
        limits:
          memory: 48M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
